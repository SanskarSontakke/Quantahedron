<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="Quantahedron">
  <title>Quantahedron</title>
  <!-- Hedron: tetrahedron inscribed in its dual, projected onto a hexagonal outline. -->
  <g stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M32 4 56 18v28L32 60 8 46V18Z" opacity="0.35" />
    <path d="M32 4 50 40H14Z" opacity="0.9" />
    <path d="M32 60 14 24h36Z" opacity="0.55" />
  </g>
  <!-- Quantum: the phase orbit and the nucleus. -->
  <ellipse cx="32" cy="32" rx="26" ry="10" stroke="currentColor" stroke-width="1.6" opacity="0.45" transform="rotate(-24 32 32)" />
  <circle cx="32" cy="32" r="4.6" fill="currentColor" />
  <circle cx="55.5" cy="21.8" r="2.6" fill="currentColor" opacity="0.85" />
</svg>
